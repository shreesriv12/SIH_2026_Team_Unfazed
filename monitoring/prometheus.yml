global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: securemailscope-api
    static_configs: [{targets: ["api:8000"]}]
  - job_name: securemailscope-worker
    static_configs: [{targets: ["worker:9100"]}]
  - job_name: securemailscope-retention
    static_configs: [{targets: ["retention:9101"]}]
  - job_name: securemailscope-zeek
    static_configs: [{targets: ["zeek:8080"]}]
    metrics_path: /metrics
