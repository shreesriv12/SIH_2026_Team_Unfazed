services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: securemailscope
      POSTGRES_USER: securemailscope
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securemailscope -d securemailscope"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  zeek:
    build:
      context: .
      dockerfile: Dockerfile.zeek
    environment:
      SECUREMAILSCOPE_ZEEK_TOKEN_FILE: /run/secrets/zeek_token
      SECUREMAILSCOPE_CAPTURE_ROOT: /data/captures
      SECUREMAILSCOPE_ZEEK_TIMEOUT_SECONDS: ${SECUREMAILSCOPE_ZEEK_TIMEOUT_SECONDS:-300}
      SECUREMAILSCOPE_ZEEK_MAX_RECORDS_PER_LOG: ${SECUREMAILSCOPE_ZEEK_MAX_RECORDS_PER_LOG:-10000}
    volumes:
      - capture-data:/data:ro
    secrets:
      - zeek_token
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python3", "-c", "import pathlib,urllib.request; token=pathlib.Path('/run/secrets/zeek_token').read_text().strip(); r=urllib.request.Request('http://127.0.0.1:8080/health',headers={'X-Zeek-Token':token}); urllib.request.urlopen(r,timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 10

  api:
    build: .
    environment: &backend-environment
      SECUREMAILSCOPE_ENV: production
      SECUREMAILSCOPE_DATABASE_HOST: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      SECUREMAILSCOPE_REDIS_URL: redis://redis:6379/0
      SECUREMAILSCOPE_JWT_SECRET_FILE: /run/secrets/jwt_secret
      SECUREMAILSCOPE_MAX_UPLOAD_BYTES: ${SECUREMAILSCOPE_MAX_UPLOAD_BYTES:-52428800}
      SECUREMAILSCOPE_JOB_TIMEOUT_SECONDS: ${SECUREMAILSCOPE_JOB_TIMEOUT_SECONDS:-600}
      SECUREMAILSCOPE_ZEEK_URL: http://zeek:8080
      SECUREMAILSCOPE_ZEEK_TOKEN_FILE: /run/secrets/zeek_token
      SECUREMAILSCOPE_ZEEK_TIMEOUT_SECONDS: ${SECUREMAILSCOPE_ZEEK_TIMEOUT_SECONDS:-300}
      SECUREMAILSCOPE_RETENTION_DAYS: ${SECUREMAILSCOPE_RETENTION_DAYS:-30}
      SECUREMAILSCOPE_RETENTION_INTERVAL_SECONDS: ${SECUREMAILSCOPE_RETENTION_INTERVAL_SECONDS:-86400}
      SECUREMAILSCOPE_RETENTION_DRY_RUN: ${SECUREMAILSCOPE_RETENTION_DRY_RUN:-false}
      SECUREMAILSCOPE_CA_BUNDLE: ${SECUREMAILSCOPE_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}
      SECUREMAILSCOPE_ALLOWED_ORIGINS: ${SECUREMAILSCOPE_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "8000:8000"
    volumes:
      - capture-data:/app/data
    secrets: &backend-secrets
      - postgres_password
      - jwt_secret
      - zeek_token
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      zeek: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 10

  worker:
    build: .
    command: ["python", "worker.py"]
    restart: unless-stopped
    environment: *backend-environment
    volumes:
      - capture-data:/app/data
    secrets: *backend-secrets
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      zeek: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: *backend-environment
    secrets: *backend-secrets
    read_only: true
    tmpfs: [/tmp]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    depends_on:
      postgres: {condition: service_healthy}

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      api: {condition: service_healthy}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256

  retention:
    build: .
    command: ["python", "retention_worker.py"]
    environment: *backend-environment
    volumes:
      - capture-data:/app/data
    secrets: *backend-secrets
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 64
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/metrics',timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      api: {condition: service_healthy}
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./monitoring/grafana/provisioning/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    secrets:
      - grafana_password
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128

  gateway:
    image: caddy:2.10-alpine
    environment:
      SECUREMAILSCOPE_DOMAIN: ${SECUREMAILSCOPE_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api: {condition: service_healthy}
      frontend: {condition: service_started}
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128

volumes:
  postgres-data:
  redis-data:
  capture-data:
  prometheus-data:
  grafana-data:
  caddy-data:
  caddy-config:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  zeek_token:
    file: ./secrets/zeek_token.txt
  grafana_password:
    file: ./secrets/grafana_password.txt
